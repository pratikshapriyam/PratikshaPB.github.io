<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Research | Pratiksha Priyam Baruah</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #0b3d2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      width: 100%;
      background-color: #001f4d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      position: fixed;
      top: 0;
      z-index: 1000;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.5rem;
      color: white;
    }

    .nav-links {
      display: flex;
      gap: 15px;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: white;
    }

    .sidebar {
      position: fixed;
      top: 60px;
      right: -200px;
      width: 200px;
      background-color: #004d40;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .sidebar.active {
      right: 0;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      padding: 10px;
    }

    .research-container {
      width: 90%;
      max-width: 1000px;
      background-color: #ccc;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      padding: 40px;
      margin-top: 100px;
      text-align: center;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }

    .research-box {
      width: 90%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin: 20px auto;
      display: flex;
      align-items: center;
    }

    .research-box:nth-child(odd) {
      flex-direction: row;
    }

    .research-box:nth-child(even) {
      flex-direction: row-reverse;
    }

    .research-text {
      width: 60%;
      padding: 20px;
    }

    .research-img {
      width: 40%;
      text-align: center;
    }

    .research-img img {
      width: 100%;
      max-width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .caption {
      font-size: 0.9em;
      color: gray;
      text-align: center;
      margin-top: 5px;
    }

    h2 {
      font-size: 1.5em;
      color: purple;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      line-height: 1.6;
      color: black;
    }

    @media (max-width: 768px) {
      .research-box {
        flex-direction: column !important;
        text-align: center;
      }

      .research-text,
      .research-img {
        width: 100%;
      }

      .research-img img {
        max-width: 80%;
      }

      .nav-links {
        display: none;
      }

      .hamburger {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <!-- Content remains the same -->
</body>
</html>
