<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Miscellaneous | Pratiksha Priyam Baruah</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- Reuse same styles as index.html --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #004d40, #003d33);
      color: #fff;
    }

    .topbar {
      background-color: #001f4d;
      padding: 15px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .topbar h1 {
      font-size: 1.5rem;
    }

    .topbar .nav-links {
      display: none;
    }

    .topbar .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger div {
      width: 30px;
      height: 4px;
      background-color: #ddd;
      border-radius: 5px;
    }

    .sidebar {
      position: fixed;
      top: 60px;
      left: -100%;
      width: 100%;
      background-color: #001f4d;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: left 0.3s ease-in-out;
      z-index: 999;
    }

    .sidebar.show {
      left: 0;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      padding: 8px 20px;
    }

    .main {
      margin-top: 80px;
      padding: 20px;
    }

    .misc-section h2 {
      color: #fff;
      margin-bottom: 20px;
    }

    .image-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .image-box {
      flex: 1 1 30%;
      background: white;
      color: #222;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .image-box img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    @media (min-width: 768px) {
      .topbar .hamburger {
        display: none;
      }

      .topbar .nav-links {
        display: flex;
        gap: 20px;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 1rem;
      }

      .nav-links a:hover {
        text-decoration: underline;
      }

      .sidebar {
        display: none;
      }
    }

    @media (max-width: 767px) {
      .image-gallery {
        flex-direction: column;
      }

      .image-box {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <h1>Pratiksha Priyam Baruah</h1>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="miscellaneous.html">Miscellaneous</a>
    </div>
    <div class="hamburger" id="hamburger">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <a href="index.html">Home</a>
    <a href="research.html">Research</a>
    <a href="miscellaneous.html">Miscellaneous</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="misc-section">
      <h2>My Hobbies</h2>
      <div class="image-gallery">
        <div class="image-box">
          <img src="egu.JPG" alt="Embroidery Work">
          <p>Colorful embroidery</p>
        </div>
        <div class="image-box">
          <img src="sc_day.jpg" alt="Nature Trip">
          <p>Scenic travel memories</p>
        </div>
        <div class="image-box">
          <img src="images/embroidery.jpg" alt="Handwork">
          <p>Detailed handwork</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Script to toggle hamburger menu -->
  <script>
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    hamburger.addEventListener('click', () => {
      sidebar.classList.toggle('show');
    });

    // Close sidebar on link click
    document.querySelectorAll('#sidebar a').forEach(link => {
      link.addEventListener('click', () => {
        sidebar.classList.remove('show');
      });
    });
  </script>
</body>
</html>
